<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена – Другие Миры VR</title>
  <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="/css/index.min.css">
  <style>
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .notfound-container {
      max-width: 600px;
    }
    .notfound-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      color: #ff3344;
      text-shadow: 0 0 30px rgba(255, 51, 68, 0.4);
      margin-bottom: 20px;
      font-family: monospace, sans-serif;
    }
    .notfound-title {
      font-size: 2rem;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .notfound-desc {
      font-size: 1.1rem;
      color: #8f9ca7;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .notfound-btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(90deg, #ff3344, #ff5566);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .notfound-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 51, 68, 0.4);
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">Страница не найдена</h1>
    <p class="notfound-desc">Запрошенный маршрут не существует или был перемещен. Вернитесь на главную страницу или перейдите в каталог игр и новостей.</p>
    <a href="/" class="notfound-btn">Вернуться на главную</a>
  </div>
</body>
</html>
